name: Validate STEMPath AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: stempath_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: stempath_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stempath_test -d stempath_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PERSISTENCE_MODE: local
      AUTH_MODE: disabled
      AI_PROVIDER: demo
      TEST_DATABASE_URL: postgres://stempath_test:isolated_ci_only@localhost:5432/stempath_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Apply explicit migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Build ECS application and migration images
        run: |
          docker build --target runner -t stempath-app:ci .
          docker build --target tooling -t stempath-tooling:ci .
          docker run --rm --network host -e DATABASE_URL="$TEST_DATABASE_URL" stempath-tooling:ci
      - name: Validate Compose with disposable placeholders
        env:
          POSTGRES_PASSWORD: isolated_ci_only
          DATABASE_URL: postgres://stempath_test:isolated_ci_only@postgres:5432/stempath_test
          SESSION_SECRET: isolated-ci-session-secret-never-production
        run: docker compose config --quiet
